global:
  scrape_interval: 15s

# Сервисы запускаются на хост-машине через mvn, а Prometheus живёт в контейнере,
# поэтому адреса — host.docker.internal (на Docker Desktop это хост-машина).
# Метка application задаётся здесь, а не в самих сервисах: по ней дашборды
# различают сервисы.
scrape_configs:
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          application: core-api

  - job_name: checker-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          application: checker-worker

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
        labels:
          application: notification-service

  - job_name: web-ui
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          application: web-ui
