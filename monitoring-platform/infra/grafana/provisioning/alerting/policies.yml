apiVersion: 1

# Корневая политика уведомлений: куда отправлять и как группировать.
policies:
  - orgId: 1
    receiver: ops-email
    group_by: ['alertname']
    # Первое письмо через 30 секунд: за это время успевают собраться связанные оповещения
    group_wait: 30s
    # Новые оповещения той же группы: не чаще раза в 5 минут
    group_interval: 5m
    # Напоминание о неустранённой проблеме: раз в 4 часа
    repeat_interval: 4h
