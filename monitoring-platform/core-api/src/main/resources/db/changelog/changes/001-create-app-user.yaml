databaseChangeLog:
  - changeSet:
      id: 001-create-app-user
      author: platform
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  # sub claim из JWT, выданного Keycloak — связь с identity,
                  # сами пароли/профили в этой БД не храним
                  name: keycloak_subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_app_user_keycloak_subject
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: plan
                  type: VARCHAR(20)
                  defaultValue: FREE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: app_user
