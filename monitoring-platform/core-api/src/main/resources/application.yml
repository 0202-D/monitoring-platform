server:
  port: 8082

spring:
  application:
    name: core-api

  datasource:
    url: jdbc:postgresql://localhost:5434/core_api
    username: core_api
    password: core_api
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ddl-auto НАМЕРЕННО validate: единственный источник правды по схеме — Liquibase.
      # Hibernate должен только проверять соответствие, а не создавать/менять таблицы сам.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/monitoring-platform

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Без гистограммы нельзя посчитать p95 задержки в Grafana
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 1.0 = трассируем каждый запрос. Для разработки удобно, в проде значение уменьшают.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    # traceId и spanId в каждой строке лога: по ним строка лога находится в Zipkin
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    org.hibernate.SQL: debug
    liquibase: info
