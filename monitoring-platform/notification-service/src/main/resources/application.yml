server:
  port: 8085

spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/monitoring-platform
  # СВОЯ БД (database-per-service): физически тот же контейнер Postgres,
  # но отдельная база и отдельный пользователь, созданные init-скриптом.
  # Порт 5434 — как в вашем docker-compose; проверьте, что он совпадает.
  datasource:
    url: jdbc:postgresql://localhost:5434/notification_service
    username: notification_service
    password: notification_service

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    # Приложение запускается на хосте через mvn, поэтому внешний listener
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      # Для НОВОЙ consumer group начинаем с начала топика, иначе события,
      # опубликованные до первого запуска сервиса, были бы пропущены
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: http://localhost:8081
        # Без этого десериализатор вернёт GenericRecord вместо MonitorStatusEvent
        specific.avro.reader: true
    listener:
      observation-enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

notification:
  topic: monitor-status-events
  mail:
    from: ${MAIL_FROM:no-reply@monitoring.local}
    web-base-url: ${WEB_UI_BASE_URL:http://localhost:8083}
telegram:
  bot-username: petrov_monitoring_bot
  bot-token: ${TELEGRAM_BOT_TOKEN:}

logging:
  level:
    com.monitoring.notificationservice: debug
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  observations:
    enable:
      tasks:
        scheduled:
          execution: false